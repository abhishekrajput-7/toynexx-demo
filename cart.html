<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TOYNEXX | Shopping Cart</title>

    <!-- Main Website CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <!-- Cart CSS -->
    <link rel="stylesheet"
          href="css/cart.css">

</head>

<body>

<main class="cart-page">

    <!-- =========================
         PAGE HEADER
    ========================== -->

    <section class="cart-header">

        <h1>
            🛒 Shopping Cart
        </h1>

        <p>
            Review your collectibles before checkout.
        </p>

    </section>

    <!-- =========================
         MAIN CART LAYOUT
    ========================== -->

    <section class="cart-layout">

        <!-- LEFT SIDE -->

        <div class="cart-left">

            <div id="cartItems">

                <!-- JS PRODUCTS -->

            </div>

        </div>

        <!-- RIGHT SIDE -->

       <aside class="cart-right">

    <div class="summary-card">

        <h2>
            Order Summary
        </h2>

        <div class="summary-row">

            <span>Subtotal</span>

            <span id="subtotal">
                ₹0
            </span>

        </div>

        <div class="summary-row">

            <span>Delivery</span>

            <span id="delivery">
                ₹0
            </span>

        </div>

        <div class="summary-row">

            <span>Discount</span>

            <span id="discountAmount">
                ₹0
            </span>

        </div>

        <hr>

        <div class="summary-total">

            <span>Total</span>

            <span id="grandTotal">
                ₹0
            </span>

        </div>

        <button id="checkoutBtn"
                class="checkout-btn">

            Proceed To Checkout

        </button>

        <button id="continueBtn"
                class="continue-btn">

            ← Continue Shopping

        </button>

    </div>

</aside>

    </section>


    <!-- =========================
     EMPTY CART
========================= -->

<section id="emptyCart" class="empty-cart" style="display:none;">

    <div class="empty-icon">
        🛒
    </div>

    <h2>
        Your Cart is Empty
    </h2>

    <p>
        Looks like you haven't added any collectibles yet.
    </p>

    <a href="index.html"
       class="shop-btn">

        Continue Shopping

    </a>

</section>

</main>

<!-- JS -->

<script src="js/products.js"></script>

<script src="js/cart.js"></script>

</body>

</html>
