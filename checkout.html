<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TOYNEXX</title>

    <!-- Brand fonts (matches the rest of the TOYNEXX site) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Your main stylesheet -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Razorpay Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080808;
            color: #fff;
            font-family: 'Manrope', Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .checkout-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 70px 20px;
        }

        .checkout-header {
            margin-bottom: 30px;
        }

        .checkout-header h1 {
            margin: 0 0 8px;
            font-size: 42px;
            font-family: 'Unbounded', 'Manrope', Arial, sans-serif;
        }

        .checkout-header p {
            margin: 0;
            color: #999;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.35fr 0.85fr;
            gap: 28px;
            align-items: start;
        }

        .card {
            background: #151515;
            border: 1px solid #303030;
            border-radius: 16px;
            padding: 28px;
        }

        .card h2 {
            margin: 0 0 24px;
            font-size: 26px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 15px;
            font-weight: 600;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #383838;
            background: #090909;
            color: #fff;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #ffd000;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .payment-title {
            margin-top: 32px !important;
            margin-bottom: 14px !important;
        }

        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: #0c0c0c;
            border: 1px solid #333;
            border-radius: 8px;
        }

        .payment-option input {
            width: auto;
        }

        .pay-btn {
            width: 100%;
            margin-top: 22px;
            padding: 17px;
            border: 0;
            border-radius: 8px;
            background: #ffd000;
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #ffe45c;
        }

        .pay-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .summary-product {
            display: flex;
            gap: 14px;
            padding-bottom: 18px;
            margin-bottom: 18px;
            border-bottom: 1px solid #303030;
        }

        .summary-product img {
            width: 78px;
            height: 78px;
            object-fit: contain;
            background: #080808;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .summary-product-info {
            min-width: 0;
            flex: 1;
        }

        .summary-product-info h3 {
            margin: 0 0 8px;
            font-size: 16px;
            line-height: 1.35;
        }

        .summary-product-info p {
            margin: 0;
            color: #aaa;
            font-size: 14px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 15px 0;
            color: #ddd;
        }

        .price-row.total {
            border-top: 1px solid #333;
            padding-top: 20px;
            margin-top: 20px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .empty-cart {
            text-align: center;
            padding: 35px 10px;
            color: #aaa;
        }

        .empty-cart h3 {
            color: #fff;
            margin-bottom: 8px;
        }

        .status {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .status.show {
            display: block;
        }

        .status.error {
            background: #3a1111;
            color: #ff9b9b;
            border: 1px solid #722222;
        }

        .status.success {
            background: #113a1d;
            color: #9affaa;
            border: 1px solid #28733a;
        }

        @media (max-width: 800px) {
            .checkout-page {
                padding: 35px 15px;
            }

            .checkout-header h1 {
                font-size: 32px;
            }

            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<div class="checkout-page">

    <div class="checkout-header">
        <h1>Checkout</h1>
        <p>Complete your details and proceed with secure payment.</p>
    </div>

    <div class="checkout-grid">

        <!-- CUSTOMER DETAILS -->
        <section class="card">
            <h2>Shipping Details</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your full name">
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="+91XXXXXXXXXX">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="City">
                </div>

                <div class="form-group full">
                    <label for="address">Address</label>
                    <textarea id="address" placeholder="House no, street, area..."></textarea>
                </div>

                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" placeholder="State">
                </div>

                <div class="form-group">
                    <label for="pinCode">PIN Code</label>
                    <input type="text" id="pinCode" maxlength="6" placeholder="110001">
                </div>

            </div>

            <h2 class="payment-title">Payment Method</h2>

            <div class="payment-option">
                <input
                    type="radio"
                    id="razorpay"
                    name="paymentMethod"
                    checked
                >
                <label for="razorpay">
                    Razorpay — UPI / Card / Net Banking
                </label>
            </div>

            <button type="button" id="payButton" class="pay-btn">
                PAY NOW
            </button>

            <div id="status" class="status"></div>
        </section>


        <!-- ORDER SUMMARY -->
        <section class="card">
            <h2>Order Summary</h2>

            <div id="productsContainer"></div>

            <div class="price-row">
                <span>Subtotal</span>
                <strong id="subtotal">₹0</strong>
            </div>

            <div class="price-row">
                <span>Shipping</span>
                <strong id="shipping">₹0</strong>
            </div>

            <div class="price-row">
                <span>Discount</span>
                <strong id="discount">₹0</strong>
            </div>

            <div class="price-row">
                <span>GST</span>
                <strong id="gst">₹0</strong>
            </div>

            <div class="price-row total">
                <span>Total</span>
                <strong id="total">₹0</strong>
            </div>
        </section>

    </div>
</div>


<!-- PRODUCTS DATA -->
<script src="js/products.js"></script>

<script>
/* =========================================================
   TOYNEXX CHECKOUT
   ========================================================= */


/* ---------------------------------------------------------
   CONFIG
   --------------------------------------------------------- */

/*
   STEP 1: Test locally (optional) -> http://localhost:3000

   STEP 2: Once you deploy the "toynexx-backend" folder (e.g. to
   Render), you'll get a URL like:

       https://toynexx-backend.onrender.com

   Paste that URL below, WITHOUT a trailing slash. Real visitors
   on your live site cannot reach "localhost" — only your own
   computer can.
*/
const API_BASE_URL = "http://localhost:3000";


/*
   RAZORPAY TEST KEY ID

   This is the PUBLIC Key ID only.
   NEVER put the Razorpay Key Secret in this HTML file.
*/
const RAZORPAY_KEY_ID = "rzp_test_TOQaaPTG7Fc70Z";


/* ---------------------------------------------------------
   SAFE LOCAL STORAGE
   --------------------------------------------------------- */

function getJSON(key, fallback) {
    try {
        const value = localStorage.getItem(key);

        if (!value) {
            return fallback;
        }

        return JSON.parse(value);

    } catch (error) {
        console.error("LocalStorage JSON error:", key, error);
        return fallback;
    }
}


/* ---------------------------------------------------------
   CHECKOUT DATA
   --------------------------------------------------------- */

const checkoutType =
    localStorage.getItem("checkoutType") || "cart";

const buyNowProduct =
    getJSON("buyNowProduct", null);

const cart =
    getJSON("cart", []);


/* ---------------------------------------------------------
   PRODUCTS
   --------------------------------------------------------- */

const PRODUCTS =
    Array.isArray(window.PRODUCTS)
        ? window.PRODUCTS
        : [];


/* ---------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------- */

const productsContainer =
    document.getElementById("productsContainer");

const subtotalElement =
    document.getElementById("subtotal");

const shippingElement =
    document.getElementById("shipping");

const discountElement =
    document.getElementById("discount");

const gstElement =
    document.getElementById("gst");

const totalElement =
    document.getElementById("total");

const payButton =
    document.getElementById("payButton");

const statusElement =
    document.getElementById("status");


/* ---------------------------------------------------------
   STATUS
   --------------------------------------------------------- */

function showStatus(message, type = "error") {
    statusElement.textContent = message;
    statusElement.className = "status show " + type;
}


/* ---------------------------------------------------------
   FIND PRODUCT
   --------------------------------------------------------- */

function findProduct(id) {
    return PRODUCTS.find(
        product =>
            String(product.id) === String(id)
    );
}


/* ---------------------------------------------------------
   GET CHECKOUT ITEMS
   --------------------------------------------------------- */

function getCheckoutItems() {

    /* BUY NOW */

    if (
        checkoutType === "buyNow" &&
        buyNowProduct
    ) {

        const product =
            findProduct(buyNowProduct.id);

        if (!product) {
            return [];
        }

        const quantity =
            Number(
                buyNowProduct.qty ??
                buyNowProduct.quantity ??
                1
            ) || 1;

        return [
            {
                product: product,
                quantity: quantity
            }
        ];
    }


    /* CART */

    if (!Array.isArray(cart)) {
        return [];
    }

    return cart
        .map(item => {

            const product =
                findProduct(item.id);

            if (!product) {
                return null;
            }

            const quantity =
                Number(
                    item.qty ??
                    item.quantity ??
                    1
                ) || 1;

            return {
                product: product,
                quantity: quantity
            };

        })
        .filter(Boolean);
}


/* ---------------------------------------------------------
   CALCULATE TOTALS
   --------------------------------------------------------- */

function calculateTotals(items) {

    let subtotal = 0;
    let discount = 0;

    items.forEach(item => {

        const product = item.product;
        const quantity = item.quantity;

        subtotal +=
            Number(product.price || 0) *
            quantity;

        if (
            product.oldPrice &&
            Number(product.oldPrice) >
            Number(product.price)
        ) {

            discount +=
                (
                    Number(product.oldPrice) -
                    Number(product.price)
                ) * quantity;
        }
    });


    /* ₹50 shipping, free above ₹999 */

    const shipping =
        subtotal >= 999
            ? 0
            : 50;


    /* GST currently kept at ₹0 */

    const gst = 0;


    const total =
        subtotal +
        shipping +
        gst;


    return {
        subtotal,
        shipping,
        discount,
        gst,
        total
    };
}


/* ---------------------------------------------------------
   RENDER CHECKOUT
   --------------------------------------------------------- */

function renderCheckout() {

    const items =
        getCheckoutItems();


    if (!items.length) {

        productsContainer.innerHTML = `
            <div class="empty-cart">
                <h3>Your cart is empty</h3>
                <p>Please add a product before checkout.</p>
            </div>
        `;

        subtotalElement.textContent = "₹0";
        shippingElement.textContent = "₹0";
        discountElement.textContent = "₹0";
        gstElement.textContent = "₹0";
        totalElement.textContent = "₹0";

        payButton.disabled = true;

        return;
    }


    payButton.disabled = false;

    let html = "";


    items.forEach(item => {

        const product = item.product;
        const quantity = item.quantity;

        const image =
            product.image || "";

        html += `
            <div class="summary-product">

                <img
                    src="${image}"
                    alt="${product.name || "Product"}"
                    onerror="this.style.display='none'"
                >

                <div class="summary-product-info">

                    <h3>
                        ${product.name || "Product"}
                    </h3>

                    <p>
                        ₹${Number(product.price || 0).toLocaleString("en-IN")}
                        × ${quantity}
                    </p>

                </div>

            </div>
        `;
    });


    productsContainer.innerHTML = html;


    const totals =
        calculateTotals(items);


    subtotalElement.textContent =
        "₹" +
        totals.subtotal.toLocaleString("en-IN");

    shippingElement.textContent =
        "₹" +
        totals.shipping.toLocaleString("en-IN");

    discountElement.textContent =
        "₹" +
        totals.discount.toLocaleString("en-IN");

    gstElement.textContent =
        "₹" +
        totals.gst.toLocaleString("en-IN");

    totalElement.textContent =
        "₹" +
        totals.total.toLocaleString("en-IN");
}


/* ---------------------------------------------------------
   CUSTOMER DETAILS
   --------------------------------------------------------- */

function getCustomerDetails() {

    return {

        fullName:
            document
                .getElementById("fullName")
                .value
                .trim(),

        phone:
            document
                .getElementById("phone")
                .value
                .trim(),

        email:
            document
                .getElementById("email")
                .value
                .trim(),

        city:
            document
                .getElementById("city")
                .value
                .trim(),

        address:
            document
                .getElementById("address")
                .value
                .trim(),

        state:
            document
                .getElementById("state")
                .value
                .trim(),

        pinCode:
            document
                .getElementById("pinCode")
                .value
                .trim()
    };
}


/* ---------------------------------------------------------
   VALIDATE CUSTOMER
   --------------------------------------------------------- */

function validateCustomer(customer) {

    if (!customer.fullName) {
        showStatus("Please enter your full name.");
        return false;
    }

    if (!customer.phone) {
        showStatus("Please enter your phone number.");
        return false;
    }

    if (!customer.email) {
        showStatus("Please enter your email.");
        return false;
    }

    if (!customer.address) {
        showStatus("Please enter your address.");
        return false;
    }

    if (!customer.city) {
        showStatus("Please enter your city.");
        return false;
    }

    if (!customer.state) {
        showStatus("Please enter your state.");
        return false;
    }

    if (!/^[0-9]{6}$/.test(customer.pinCode)) {
        showStatus("Please enter a valid 6-digit PIN code.");
        return false;
    }

    return true;
}


/* ---------------------------------------------------------
   CREATE RAZORPAY ORDER
   --------------------------------------------------------- */

async function createOrder(amount) {

    const response =
        await fetch(
            API_BASE_URL + "/create-order",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    amount: amount
                })
            }
        );


    let data;

    try {
        data = await response.json();
    } catch (error) {
        throw new Error(
            "Server returned an invalid response."
        );
    }


    if (!response.ok) {

        throw new Error(
            data.message ||
            data.error?.description ||
            "Unable to create payment order."
        );
    }


    if (
        !data.success ||
        !data.order ||
        !data.order.id
    ) {

        throw new Error(
            "Invalid order received from server."
        );
    }


    return data.order;
}


/* ---------------------------------------------------------
   OPEN RAZORPAY
   --------------------------------------------------------- */

function openRazorpay(order, customer) {

    if (typeof Razorpay === "undefined") {
        throw new Error(
            "Razorpay Checkout failed to load."
        );
    }


    if (
        !RAZORPAY_KEY_ID ||
        RAZORPAY_KEY_ID === "YOUR_RAZORPAY_TEST_KEY_ID"
    ) {
        throw new Error(
            "Razorpay Test Key ID is missing."
        );
    }


    if (
        !order ||
        !order.id ||
        !order.amount
    ) {
        throw new Error(
            "Invalid Razorpay order received."
        );
    }


    const options = {

        key: RAZORPAY_KEY_ID,

        amount: Number(order.amount),

        currency:
            order.currency || "INR",

        name: "TOYNEXX",

        description:
            "TOYNEXX Collectibles Order",

        order_id:
            order.id,

        prefill: {

            name:
                customer.fullName,

            email:
                customer.email,

            contact:
                customer.phone
        },

        notes: {

            address:
                customer.address,

            city:
                customer.city,

            state:
                customer.state,

            pinCode:
                customer.pinCode
        },

        theme: {
            color: "#FFD000"
        },

        retry: {
            enabled: true
        },

        modal: {

            ondismiss: function () {

                payButton.disabled = false;
                payButton.textContent = "PAY NOW";
            }
        },

        handler: async function (response) {

            console.log(
                "Razorpay payment response:",
                response
            );

            payButton.textContent =
                "VERIFYING PAYMENT...";

            /*
              BUG FIX: previously this code trusted whatever the
              browser said and immediately showed "Payment
              successful" — that can be faked from the browser
              console. Now we send the signature to our own
              backend, which checks it with the secret key.
              Only a verified response counts as a real order.
            */

            try {

                const verifyResponse = await fetch(
                    API_BASE_URL + "/verify-payment",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature
                        })
                    }
                );

                const verifyData = await verifyResponse.json();

                if (!verifyResponse.ok || !verifyData.success) {

                    showStatus(
                        "We received a payment, but could not verify it. " +
                        "Please contact support with Payment ID: " +
                        response.razorpay_payment_id
                    );

                    payButton.disabled = false;
                    payButton.textContent = "PAY NOW";

                    return;
                }

                /* Genuinely confirmed — safe to clear the cart now. */

                localStorage.removeItem("cart");
                localStorage.removeItem("buyNowProduct");
                localStorage.removeItem("checkoutType");

                showStatus(
                    "Payment successful! Payment ID: " +
                    response.razorpay_payment_id,
                    "success"
                );

                payButton.disabled = true;
                payButton.textContent =
                    "PAYMENT SUCCESSFUL";

            } catch (error) {

                console.error("Verification error:", error);

                showStatus(
                    "Payment received, but verification failed due to a " +
                    "network error. Please contact support with Payment ID: " +
                    response.razorpay_payment_id
                );

                payButton.disabled = false;
                payButton.textContent = "PAY NOW";
            }
        }
    };


    const razorpay =
        new Razorpay(options);


    razorpay.on(
        "payment.failed",
        function (response) {

            console.error(
                "Razorpay payment failed:",
                response.error
            );

            showStatus(
                response.error?.description ||
                "Payment failed. Please try again."
            );

            payButton.disabled = false;
            payButton.textContent = "PAY NOW";
        }
    );


    razorpay.open();
}


/* ---------------------------------------------------------
   PAY BUTTON
   --------------------------------------------------------- */

payButton.addEventListener(
    "click",
    async function () {

        try {

            statusElement.className = "status";


            const customer =
                getCustomerDetails();


            if (!validateCustomer(customer)) {
                return;
            }


            const items =
                getCheckoutItems();


            if (!items.length) {

                showStatus(
                    "Your cart is empty."
                );

                return;
            }


            const totals =
                calculateTotals(items);


            if (
                !Number.isFinite(totals.total) ||
                totals.total <= 0
            ) {

                showStatus(
                    "Invalid order amount."
                );

                return;
            }


            payButton.disabled = true;
            payButton.textContent =
                "CREATING ORDER...";


            /*
              Backend should receive RUPEES.
              Your server should convert rupees
              to paise before creating the Razorpay order.
            */

            const order =
                await createOrder(
                    totals.total
                );


            console.log(
                "Razorpay order created:",
                order
            );


            payButton.textContent =
                "OPENING PAYMENT...";


            openRazorpay(
                order,
                customer
            );

        } catch (error) {

            console.error(
                "Payment Error:",
                error
            );


            showStatus(
                error.message ||
                "Something went wrong."
            );


            payButton.disabled = false;
            payButton.textContent = "PAY NOW";
        }
    }
);


/* ---------------------------------------------------------
   INITIALIZE
   --------------------------------------------------------- */

renderCheckout();

</script>

</body>
</html>
